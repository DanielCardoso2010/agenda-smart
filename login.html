<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar — Agenda Smart</title><link rel="icon" href="assets/logo.svg"><link rel="stylesheet" href="css/style.css"></head>
<body><div class="auth">
<form id="f-login" class="card"><h2>Entrar</h2><label for="l-email">E-mail</label><input id="l-email" type="email" required autocomplete="email"><label for="l-senha">Senha</label><input id="l-senha" type="password" required autocomplete="current-password"><label><input type="checkbox" id="l-ver" style="width:auto"> Mostrar senha</label><br><label><input type="checkbox" id="l-manter" style="width:auto" checked> Permanecer conectado</label><p class="erro"></p><button class="btn" style="width:100%">Entrar</button><p><a href="#recuperar">Esqueci a senha</a> · <a href="#cadastro">Criar conta</a></p></form>
<form id="f-cadastro" class="card" hidden><h2>Criar conta</h2><label for="c-nome">Nome completo</label><input id="c-nome" required minlength="3"><label for="c-email">E-mail</label><input id="c-email" type="email" required><label for="c-senha">Senha (mín. 6)</label><input id="c-senha" type="password" required minlength="6"><label for="c-conf">Confirmar senha</label><input id="c-conf" type="password" required><p class="erro"></p><button class="btn" style="width:100%">Cadastrar</button><p><a href="#login">Já tenho conta</a></p></form>
<form id="f-recuperar" class="card" hidden><h2>Recuperar senha</h2><label for="r-email">E-mail</label><input id="r-email" type="email" required><p class="erro"></p><button class="btn" style="width:100%">Enviar link</button><p><a href="#login">Voltar</a></p></form>
<form id="f-redefinir" class="card" hidden><h2>Redefinir senha</h2><label for="n-senha">Nova senha (mín. 6)</label><input id="n-senha" type="password" required minlength="6" autocomplete="new-password"><label for="n-conf">Confirmar senha</label><input id="n-conf" type="password" required minlength="6" autocomplete="new-password"><p class="erro"></p><button class="btn" style="width:100%">Salvar senha</button></form>
</div><script type="module" src="js/auth.js"></script></body></html>
